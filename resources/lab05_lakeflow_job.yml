resources:
  jobs:
    lab05_lakeflow_job:
      name: "Lab 05 - Citi Bike Lakeflow Orchestration"

      description: >
        Operational Lab 05 orchestration.
        Production schema and managed Volumes are created by the Bundle,
        not by this Job. The Job prepares runtime folders/source data,
        produces one immutable station_status snapshot, runs the Lakeflow
        pipeline incrementally, then executes final validation.

      max_concurrent_runs: 1

      # Applies to serverless Job tasks, including the serverless Lakeflow
      # pipeline task. It does not change the performance of GP1/GP2 tasks.
      performance_target: PERFORMANCE_OPTIMIZED

      parameters:
        - name: catalog
          default: ${var.lab05_catalog}

        - name: schema
          default: ${var.lab05_schema}

        - name: volume_name
          default: ${var.lab05_volume_name}

        - name: streaming_volume_name
          default: ${var.lab05_streaming_volume_name}

        - name: seed_snapshot_count
          default: "3"

        - name: run_checks
          default: "true"

      tasks:
        # 00_setup intentionally removed.
        # Infrastructure belongs to Bundle deployment, not the operational Job.

        - task_key: 01_source_preparation
          notebook_task:
            notebook_path: ../labs/lab_05_lakeflow/notebooks/lab05_01_source_preparation.ipynb
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"
              volume_name: "{{job.parameters.volume_name}}"
              streaming_volume_name: "{{job.parameters.streaming_volume_name}}"
              seed_snapshot_count: "{{job.parameters.seed_snapshot_count}}"

        - task_key: produce_status_snapshot
          depends_on:
            - task_key: 01_source_preparation
          spark_python_task:
            python_file: ../labs/lab_05_lakeflow/tools/citibike_status_producer.py
            parameters:
              - "--catalog"
              - "{{job.parameters.catalog}}"
              - "--schema"
              - "{{job.parameters.schema}}"
              - "--streaming-volume-name"
              - "{{job.parameters.streaming_volume_name}}"

        - task_key: run_lakeflow_pipeline
          depends_on:
            - task_key: produce_status_snapshot
          pipeline_task:
            pipeline_id: ${resources.pipelines.lab05_lakeflow_pipeline.id}
            full_refresh: false

        - task_key: validate_pipeline
          depends_on:
            - task_key: run_lakeflow_pipeline
          notebook_task:
            notebook_path: ../labs/lab_05_lakeflow/notebooks/lab05_02_validation.ipynb
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"
              volume_name: "{{job.parameters.volume_name}}"
              streaming_volume_name: "{{job.parameters.streaming_volume_name}}"
              run_checks: "{{job.parameters.run_checks}}"

      # Needed only by the Personal serverless Python task.
      # Azure targets attach the Python task to GP1/GP2 instead.
      environments:
        - environment_key: default
          spec:
            environment_version: "5"
            dependencies:
              - "requests>=2.31,<3"

      tags:
        lab: "05"
        project: "citibike_lakeflow"
        purpose: "orchestration"
