resources:
  jobs:
    lab05_lakeflow_job:
      name: "Lab 05 - Citi Bike Lakeflow Orchestration"

      description: >
        End-to-end orchestration for Lab 05.
        Creates and validates the required managed volumes and directories,
        prepares Citi Bike source data, produces one new immutable
        station_status snapshot, runs the Lakeflow pipeline incrementally,
        then executes final validation.

      max_concurrent_runs: 1
      performance_target: STANDARD

      parameters:
        - name: catalog
          default: dbr_dev

        - name: schema
          default: parvinbadalov

        - name: volume_name
          default: lab05_lakeflow

        - name: streaming_volume_name
          default: lab05_lakeflow_streaming

        - name: seed_snapshot_count
          default: "3"

        - name: run_checks
          default: "true"

      tasks:

        # ---------------------------------------------------------------
        # 0. Create / validate schema, managed volumes and directories.
        # Safe to rerun because setup uses IF NOT EXISTS.
        # ---------------------------------------------------------------
        - task_key: 00_setup
          notebook_task:
            notebook_path: ../labs/lab_05_lakeflow/notebooks/lab05_00_setup.ipynb
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"
              volume_name: "{{job.parameters.volume_name}}"
              streaming_volume_name: "{{job.parameters.streaming_volume_name}}"

        # ---------------------------------------------------------------
        # 1. Prepare batch/reference data and initial streaming snapshots.
        # ---------------------------------------------------------------
        - task_key: 01_source_preparation
          depends_on:
            - task_key: 00_setup
          notebook_task:
            notebook_path: ../labs/lab_05_lakeflow/notebooks/lab05_01_source_preparation.ipynb
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"
              volume_name: "{{job.parameters.volume_name}}"
              streaming_volume_name: "{{job.parameters.streaming_volume_name}}"
              seed_snapshot_count: "{{job.parameters.seed_snapshot_count}}"

        # ---------------------------------------------------------------
        # 2. Produce exactly one additional immutable station_status file.
        # ---------------------------------------------------------------
        - task_key: produce_status_snapshot
          depends_on:
            - task_key: 01_source_preparation
          spark_python_task:
            python_file: ../labs/lab_05_lakeflow/tools/citibike_status_producer.py
            parameters:
              - "--catalog"
              - "{{job.parameters.catalog}}"
              - "--schema"
              - "{{job.parameters.schema}}"
              - "--streaming-volume-name"
              - "{{job.parameters.streaming_volume_name}}"
          environment_key: default

        # ---------------------------------------------------------------
        # 3. Run Lakeflow incrementally.
        # ---------------------------------------------------------------
        - task_key: run_lakeflow_pipeline
          depends_on:
            - task_key: produce_status_snapshot
          pipeline_task:
            pipeline_id: ${resources.pipelines.lab05_lakeflow_pipeline.id}
            full_refresh: false

        # ---------------------------------------------------------------
        # 4. Validate final pipeline output.
        # ---------------------------------------------------------------
        - task_key: validate_pipeline
          depends_on:
            - task_key: run_lakeflow_pipeline
          notebook_task:
            notebook_path: ../labs/lab_05_lakeflow/notebooks/lab05_02_validation.ipynb
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"
              volume_name: "{{job.parameters.volume_name}}"
              streaming_volume_name: "{{job.parameters.streaming_volume_name}}"
              run_checks: "{{job.parameters.run_checks}}"

      environments:
        - environment_key: default
          spec:
            environment_version: "5"
            dependencies:
              - "requests>=2.31,<3"

      tags:
        lab: "05"
        project: "citibike_lakeflow"
        purpose: "orchestration"
