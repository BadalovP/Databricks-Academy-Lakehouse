resources:
  pipelines:
    lab05_lakeflow_pipeline:
      name: "Lab 05 - Citi Bike Lakeflow Pipeline"

      catalog: ${var.lab05_catalog}
      schema: ${var.lab05_schema}

      # Add the Lab 05 project root to sys.path so imports like
      # `from src.config import ...` work inside the pipeline.
      root_path: ../labs/lab_05_lakeflow

      serverless: true
      continuous: false

      libraries:
        - file:
            path: ../labs/lab_05_lakeflow/pipeline/bronze.py

        - file:
            path: ../labs/lab_05_lakeflow/pipeline/silver.py

        - file:
            path: ../labs/lab_05_lakeflow/pipeline/gold.py

      # IMPORTANT:
      # src/config.py expects these exact Spark configuration keys.
      configuration:
        lab05.catalog: ${var.lab05_catalog}
        lab05.schema: ${var.lab05_schema}
        lab05.volume_name: ${var.lab05_volume_name}
        lab05.streaming_volume_name: ${var.lab05_streaming_volume_name}

      channel: CURRENT

      tags:
        lab: "05"
        project: "citibike_lakeflow"
        purpose: "declarative_pipeline"