[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lab11-zerobus"
version = "0.1.0"
description = "Zerobus Ingest producer, idempotent Bronze-to-Silver processing and validation for IoT telemetry"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
zerobus = ["databricks-zerobus-ingest-sdk>=1.10,<2"]
databricks = ["databricks-sdk>=0.70.0"]
dev = [
  "duckdb>=1.4.0",
  "pytest>=8.0",
  "ruff>=0.9.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["sdk: checks the installed Zerobus SDK interface; skipped when the SDK is not installed"]

[tool.ruff]
line-length = 100
target-version = "py311"
builtins = ["dbutils", "display", "spark"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["lab11"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*.py" = ["E402"]
