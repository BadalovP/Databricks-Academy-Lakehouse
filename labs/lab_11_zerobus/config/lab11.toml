# Lab 11 configuration. No credentials here: the service principal is read from
# ZEROBUS_CLIENT_ID / ZEROBUS_CLIENT_SECRET at run time.

[producer]
producer_id = "lab11-producer-01"
devices = 4
readings_per_device = 6
# Events re-sent with the same event_id after they were acknowledged, to reproduce
# the duplicate a producer creates when it retries after losing an acknowledgment.
replay_count = 6
batch_size = 10
base_timestamp = "2026-10-12T08:00:00Z"
interval_seconds = 60
seed = 11

[transport]
max_attempts = 3
backoff_initial_seconds = 1.0
backoff_max_seconds = 8.0
flush_timeout_seconds = 60
server_ack_timeout_seconds = 60

[tables]
bronze = "bronze_iot_events"
silver = "silver_iot_events"

