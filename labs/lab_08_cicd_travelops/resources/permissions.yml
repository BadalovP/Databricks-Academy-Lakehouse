# LAB 08 - TravelOps
#
# File:
# resources/permissions.yml
#
# Purpose:
# Documents the permissions-as-code strategy configured per bundle target.
#
# Ownership:
# DAB target permissions own job, pipeline, dashboard, alert and bundle-root
# permissions.
# Terraform owns raw Volume grants, Azure RBAC and Databricks storage access
# primitives.
#
# Environment behavior:
# Personal targets preserve their existing human deployer. Azure PROD leaves
# its existing human IS_OWNER entry implicit and grants only the registered
# GitHub service principal CAN_MANAGE. The shared SQL warehouse CAN_USE grant
# remains a one-time workspace bootstrap because the warehouse is not owned by
# this bundle.
#
# Note:
# Databricks Asset Bundles apply target-level permissions to the bundle root and
# supported resources. This file intentionally contains comments only to avoid
# duplicate resource ownership.
