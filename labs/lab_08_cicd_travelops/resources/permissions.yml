# LAB 08 - TravelOps
#
# File:
# resources/permissions.yml
#
# Purpose:
# Documents the permissions-as-code strategy configured per bundle target.
#
# Ownership:
# DAB target permissions own job, pipeline, dashboard, alert and bundle-root
# permissions.
# Terraform owns raw Volume grants, Azure RBAC and Databricks storage access
# primitives.
#
# Environment behavior:
# Personal DEV and Personal PROD use target-level bundle permissions that grant
# the human deployer CAN_MANAGE. Azure PROD does not use target-level bundle
# permissions because the adopted job and pipeline already have human IS_OWNER
# ownership and the service principal must be granted CAN_MANAGE only on those
# resource objects, not through parent-level propagation.
#
# Azure bundle-root CI access is a one-time bootstrap/check: the bundle root and
# workspace root may retain the GitHub service principal CAN_MANAGE permission for
# the bundle working directory and inherited child resources, but DAB should not
# propagate that root grant onto the adopted job and pipeline objects. Dashboard
# and alert permissions remain inherited from the root and are not managed as
# direct job-specific ACLs.
#
# The shared SQL warehouse CAN_USE grant remains a one-time workspace bootstrap
# because the warehouse is not owned by this bundle.
#
# Note:
# This file intentionally contains comments only to avoid duplicate resource
# ownership, while the Azure PROD target defines the exact resource-scoped job
# and pipeline ACLs required to preserve the existing human IS_OWNER semantics.
