bundle:
  name: databricks-academy-lakehouse
  engine: direct

include:
  - resources/*.yml
  - Demos/Demo1/resources/*.yml

variables:
  # -------------------------------------------------------------------
  # Lab 03
  # -------------------------------------------------------------------

  lab03_cluster_id:
    description: Existing cluster used by the Lab 03 Job
    default: "0702-132442-toro5spu"

  # -------------------------------------------------------------------
  # Lab 05
  # -------------------------------------------------------------------

  lab05_cluster_id:
    description: >
      Existing all-purpose cluster used by Lab 05 in Azure targets.
      tools/run_academy_lab.sh can override this value after checking GP1/GP2.
      Personal targets keep Lab 05 serverless and do not use this value.
    default: "0702-132442-toro5spu"

  # -------------------------------------------------------------------
  # Lab 06 V1
  # -------------------------------------------------------------------

  lab06_warehouse_id:
    description: SQL warehouse used by Lab 06 Dashboard and Genie

  lab06_alert_subscriber_email:
    description: Workspace user email that receives the Lab 06 SQL alert

  lab06_alert_parent_path:
    description: Workspace folder containing the Lab 06 SQL alert

  # -------------------------------------------------------------------
  # Lab 06 External V2
  # -------------------------------------------------------------------

  lab06_external_catalog:
    description: Catalog used by Lab 06 External V2
    default: "dbr_dev"

  lab06_external_source_schema:
    description: Schema containing the existing shared Synthea source Volume
    default: "parvinbadalov"

  lab06_external_source_volume_name:
    description: Existing shared Synthea source Volume
    default: "lab06_gold_analytics"

  lab06_external_target_schema:
    description: Unity Catalog schema used to register External V2 Gold tables
    default: "parvinbadalov_lab06_ext"

  lab06_external_gold_root:
    description: Shared ADLS root used by External V2 Delta Gold tables
    default: "abfss://parvinbadalov@dlspl21databricks.dfs.core.windows.net/lab06_gold_external_v2"

targets:
  # ===================================================================
  # AZURE - DEVELOPMENT
  # ===================================================================

  azure_dev:
    mode: development

    workspace:
      host: https://adb-7405604503619901.1.azuredatabricks.net

    variables:
      lab05_cluster_id: "0702-132442-toro5spu"
      lab06_warehouse_id: "3ed106620db591d9"
      lab06_alert_subscriber_email: "parvinbadalov@softserve.academy"
      lab06_alert_parent_path: "/Workspace/Users/parvinbadalov@softserve.academy"

    # Lab 05:
    # Azure notebook/Python tasks use an existing all-purpose cluster.
    # The runner may override lab05_cluster_id with GP2 if GP2 is already active.
    resources:
      jobs:
        lab05_lakeflow_job:
          tasks:
            - task_key: 00_setup
              existing_cluster_id: ${var.lab05_cluster_id}

            - task_key: 01_source_preparation
              existing_cluster_id: ${var.lab05_cluster_id}

            - task_key: produce_status_snapshot
              existing_cluster_id: ${var.lab05_cluster_id}

            - task_key: validate_pipeline
              existing_cluster_id: ${var.lab05_cluster_id}

  # ===================================================================
  # AZURE - PRODUCTION TEST
  # ===================================================================

  azure_prod:
    mode: production

    workspace:
      host: https://adb-7405604503619901.1.azuredatabricks.net
      root_path: /Workspace/Users/parvinbadalov@softserve.academy/.bundle/${bundle.name}/azure_prod

    git:
      branch: main

    run_as:
      user_name: parvinbadalov@softserve.academy

    permissions:
      - level: CAN_MANAGE
        user_name: parvinbadalov@softserve.academy

    variables:
      lab05_cluster_id: "0702-132442-toro5spu"
      lab06_warehouse_id: "3ed106620db591d9"
      lab06_alert_subscriber_email: "parvinbadalov@softserve.academy"
      lab06_alert_parent_path: "/Workspace/Users/parvinbadalov@softserve.academy"

    resources:
      jobs:
        lab05_lakeflow_job:
          tasks:
            - task_key: 00_setup
              existing_cluster_id: ${var.lab05_cluster_id}

            - task_key: 01_source_preparation
              existing_cluster_id: ${var.lab05_cluster_id}

            - task_key: produce_status_snapshot
              existing_cluster_id: ${var.lab05_cluster_id}

            - task_key: validate_pipeline
              existing_cluster_id: ${var.lab05_cluster_id}

  # ===================================================================
  # PERSONAL - DEVELOPMENT
  # ===================================================================

  personal_dev:
    mode: development
    default: true

    workspace:
      host: https://dbc-1750318a-76a9.cloud.databricks.com

    variables:
      lab06_warehouse_id: "410e5f3b4784e981"
      lab06_alert_subscriber_email: "parvinbadalov@yahoo.com"
      lab06_alert_parent_path: "/Workspace/Users/parvinbadalov@yahoo.com/Drafts"

    # Lab 05:
    # Notebook tasks are serverless when no cluster is specified.
    # Python script tasks need an environment_key for serverless compute.
    resources:
      jobs:
        lab05_lakeflow_job:
          tasks:
            - task_key: produce_status_snapshot
              environment_key: default

  # ===================================================================
  # PERSONAL - PRODUCTION TEST
  # ===================================================================

  personal_prod:
    mode: production

    workspace:
      host: https://dbc-1750318a-76a9.cloud.databricks.com
      root_path: /Workspace/Users/parvinbadalov@yahoo.com/.bundle/${bundle.name}/personal_prod

    git:
      branch: main

    run_as:
      user_name: parvinbadalov@yahoo.com

    permissions:
      - level: CAN_MANAGE
        user_name: parvinbadalov@yahoo.com

    variables:
      lab06_warehouse_id: "410e5f3b4784e981"
      lab06_alert_subscriber_email: "parvinbadalov@yahoo.com"
      lab06_alert_parent_path: "/Workspace/Users/parvinbadalov@yahoo.com/Drafts"

    resources:
      jobs:
        lab05_lakeflow_job:
          tasks:
            - task_key: produce_status_snapshot
              environment_key: default