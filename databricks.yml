bundle:
  name: databricks-academy-lakehouse
  engine: direct

include:
  - resources/*.yml
  - Demos/Demo1/resources/*.yml

variables:
  # -------------------------------------------------------------------
  # Lab 03
  # -------------------------------------------------------------------
  lab03_cluster_id:
    description: Existing cluster used by the Lab 03 Job
    default: "0702-132442-toro5spu"

  # -------------------------------------------------------------------
  # Lab 05
  # -------------------------------------------------------------------
  lab05_cluster_id:
    description: >
      Existing all-purpose cluster used by Lab 05 notebook and Python tasks
      in Azure targets. tools/run_academy_lab.sh can override this value.
    default: "0702-132442-toro5spu"

  lab05_catalog:
    description: Unity Catalog catalog used by Lab 05
    default: "dbr_dev"

  lab05_schema:
    description: Unity Catalog schema used by Lab 05
    default: "parvinbadalov"

  lab05_volume_name:
    description: Managed Volume used for Lab 05 reference and test data
    default: "lab05_lakeflow"

  lab05_streaming_volume_name:
    description: Managed Volume used for Lab 05 streaming landing data
    default: "lab05_lakeflow_streaming"

  # -------------------------------------------------------------------
  # Lab 06
  # -------------------------------------------------------------------
  lab06_cluster_id:
    description: >
      Existing all-purpose cluster used by Lab 06 notebook tasks in Azure
      targets. tools/run_academy_lab.sh can override this value.
    default: "0702-132442-toro5spu"

  lab06_warehouse_id:
    description: SQL warehouse used by Lab 06 Dashboard and Genie

  lab06_alert_subscriber_email:
    description: Workspace user email that receives the Lab 06 SQL alert

  lab06_alert_parent_path:
    description: Workspace folder containing the Lab 06 SQL alert

  lab06_external_catalog:
    description: Catalog used by Lab 06 External V2
    default: "dbr_dev"

  lab06_external_source_schema:
    description: Schema containing the existing shared Synthea source Volume
    default: "parvinbadalov"

  lab06_external_source_volume_name:
    description: Existing shared Synthea source Volume
    default: "lab06_gold_analytics"

  lab06_external_target_schema:
    description: Unity Catalog schema used to register External V2 Gold tables
    default: "parvinbadalov_lab06_ext"

  lab06_external_gold_root:
    description: Shared ADLS root used by External V2 Delta Gold tables
    default: "abfss://parvinbadalov@dlspl21databricks.dfs.core.windows.net/lab06_gold_external_v2"

  # -------------------------------------------------------------------
  # Lab 07
  # -------------------------------------------------------------------
  lab07_catalog:
    description: Catalog used by Lab 07
    default: "dbr_dev"

  lab07_schema:
    description: Existing shared schema used by Lab 07
    default: "parvinbadalov"

  lab07_volume_name:
    description: External Unity Catalog Volume used by Lab 07
    default: "lab07_data_quality"

  lab07_snapshot_count:
    description: Number of canonical Chicago license snapshots used by Lab 07
    default: "3"

  lab07_snapshot_cutoffs:
    description: Comma-separated cutoff dates used to build canonical snapshots
    default: "2024-12-31,2025-12-31,2026-08-15"

  lab07_cluster_id:
    description: Existing Azure cluster used by Lab 07 notebook tasks
    default: "0702-132442-toro5spu"

  lab07_warehouse_id:
    description: SQL warehouse used by Lab 07 quality monitoring resources

targets:
  # ===================================================================
  # AZURE - DEVELOPMENT
  # ===================================================================
  azure_dev:
    mode: development

    workspace:
      host: https://adb-7405604503619901.1.azuredatabricks.net

    variables:
      lab05_catalog: "dbr_dev"
      lab05_schema: "parvinbadalov"
      lab05_cluster_id: "0702-132442-toro5spu"

      lab06_cluster_id: "0702-132442-toro5spu"
      lab06_warehouse_id: "3ed106620db591d9"
      lab06_alert_subscriber_email: "parvinbadalov@softserve.academy"
      lab06_alert_parent_path: "/Workspace/Users/parvinbadalov@softserve.academy"

      lab07_cluster_id: "0702-132442-toro5spu"
      lab07_warehouse_id: "3ed106620db591d9"

    resources:
      jobs:
        lab05_lakeflow_job:
          tasks:
            - task_key: 01_source_preparation
              existing_cluster_id: ${var.lab05_cluster_id}

            - task_key: produce_status_snapshot
              existing_cluster_id: ${var.lab05_cluster_id}

            - task_key: validate_pipeline
              existing_cluster_id: ${var.lab05_cluster_id}

        lab06_external_gold_job:
          tasks:
            - task_key: 01_dimensions
              existing_cluster_id: ${var.lab06_cluster_id}

            - task_key: 02_fact_encounters
              existing_cluster_id: ${var.lab06_cluster_id}

            - task_key: 03_fact_conditions
              existing_cluster_id: ${var.lab06_cluster_id}

            - task_key: 04_aggregations
              existing_cluster_id: ${var.lab06_cluster_id}

            - task_key: 05_register_shared_tables
              existing_cluster_id: ${var.lab06_cluster_id}

            - task_key: 06_alert_metrics
              existing_cluster_id: ${var.lab06_cluster_id}

            - task_key: 08_governance
              existing_cluster_id: ${var.lab06_cluster_id}

            - task_key: 07_validation
              existing_cluster_id: ${var.lab06_cluster_id}

        lab07_data_quality_job:
          tasks:
            - task_key: 00_source_preparation
              existing_cluster_id: ${var.lab07_cluster_id}

            - task_key: 02_scd2_validation
              existing_cluster_id: ${var.lab07_cluster_id}

            - task_key: 03_quarantine_review
              existing_cluster_id: ${var.lab07_cluster_id}

            - task_key: 04_delta_constraints
              existing_cluster_id: ${var.lab07_cluster_id}

            - task_key: 05_gx_validation
              existing_cluster_id: ${var.lab07_cluster_id}

            - task_key: 06_reconciliation
              existing_cluster_id: ${var.lab07_cluster_id}

            - task_key: 07_freshness_volume
              existing_cluster_id: ${var.lab07_cluster_id}

            - task_key: 08_schema_contract
              existing_cluster_id: ${var.lab07_cluster_id}

            - task_key: 09_monitoring_validation
              existing_cluster_id: ${var.lab07_cluster_id}

            - task_key: 10_quality_scorecard
              existing_cluster_id: ${var.lab07_cluster_id}

            - task_key: 11_final_gate
              existing_cluster_id: ${var.lab07_cluster_id}

      pipelines:
        lab07_quality_pipeline:
          channel: CURRENT

  # ===================================================================
  # AZURE - PRODUCTION TEST
  # ===================================================================
  azure_prod:
    mode: production

    workspace:
      host: https://adb-7405604503619901.1.azuredatabricks.net
      root_path: /Workspace/Users/parvinbadalov@softserve.academy/.bundle/${bundle.name}/azure_prod

    git:
      branch: main

    run_as:
      user_name: parvinbadalov@softserve.academy

    permissions:
      - level: CAN_MANAGE
        user_name: parvinbadalov@softserve.academy

    variables:
      lab05_catalog: "dbr_dev"
      lab05_schema: "parvinbadalov_lab05_prod"
      lab05_cluster_id: "0702-132442-toro5spu"

      lab06_cluster_id: "0702-132442-toro5spu"
      lab06_warehouse_id: "3ed106620db591d9"
      lab06_alert_subscriber_email: "parvinbadalov@softserve.academy"
      lab06_alert_parent_path: "/Workspace/Users/parvinbadalov@softserve.academy"

      lab07_cluster_id: "0702-132442-toro5spu"
      lab07_warehouse_id: "3ed106620db591d9"

    resources:
      jobs:
        lab05_lakeflow_job:
          tasks:
            - task_key: 01_source_preparation
              existing_cluster_id: ${var.lab05_cluster_id}

            - task_key: produce_status_snapshot
              existing_cluster_id: ${var.lab05_cluster_id}

            - task_key: validate_pipeline
              existing_cluster_id: ${var.lab05_cluster_id}

        lab06_external_gold_job:
          tasks:
            - task_key: 01_dimensions
              existing_cluster_id: ${var.lab06_cluster_id}

            - task_key: 02_fact_encounters
              existing_cluster_id: ${var.lab06_cluster_id}

            - task_key: 03_fact_conditions
              existing_cluster_id: ${var.lab06_cluster_id}

            - task_key: 04_aggregations
              existing_cluster_id: ${var.lab06_cluster_id}

            - task_key: 05_register_shared_tables
              existing_cluster_id: ${var.lab06_cluster_id}

            - task_key: 06_alert_metrics
              existing_cluster_id: ${var.lab06_cluster_id}

            - task_key: 08_governance
              existing_cluster_id: ${var.lab06_cluster_id}

            - task_key: 07_validation
              existing_cluster_id: ${var.lab06_cluster_id}

        lab07_data_quality_job:
          tasks:
            - task_key: 00_source_preparation
              existing_cluster_id: ${var.lab07_cluster_id}

            - task_key: 02_scd2_validation
              existing_cluster_id: ${var.lab07_cluster_id}

            - task_key: 03_quarantine_review
              existing_cluster_id: ${var.lab07_cluster_id}

            - task_key: 04_delta_constraints
              existing_cluster_id: ${var.lab07_cluster_id}

            - task_key: 05_gx_validation
              existing_cluster_id: ${var.lab07_cluster_id}

            - task_key: 06_reconciliation
              existing_cluster_id: ${var.lab07_cluster_id}

            - task_key: 07_freshness_volume
              existing_cluster_id: ${var.lab07_cluster_id}

            - task_key: 08_schema_contract
              existing_cluster_id: ${var.lab07_cluster_id}

            - task_key: 09_monitoring_validation
              existing_cluster_id: ${var.lab07_cluster_id}

            - task_key: 10_quality_scorecard
              existing_cluster_id: ${var.lab07_cluster_id}

            - task_key: 11_final_gate
              existing_cluster_id: ${var.lab07_cluster_id}

  # ===================================================================
  # PERSONAL - DEVELOPMENT
  # ===================================================================
  personal_dev:
    mode: development

    workspace:
      host: https://dbc-1750318a-76a9.cloud.databricks.com

    variables:
      lab05_catalog: "dbr_dev"
      lab05_schema: "parvinbadalov"

      lab06_warehouse_id: "410e5f3b4784e981"
      lab06_alert_subscriber_email: "parvinbadalov@yahoo.com"
      lab06_alert_parent_path: "/Workspace/Users/parvinbadalov@yahoo.com/Drafts"

      lab07_warehouse_id: "410e5f3b4784e981"

    resources:
      jobs:
        lab05_lakeflow_job:
          tasks:
            - task_key: produce_status_snapshot
              environment_key: default

  # ===================================================================
  # PERSONAL - NORMAL / NEUTRAL
  # No development or production mode.
  # Use this target for a normal Lab 07 pipeline deployment/run.
  # ===================================================================
  personal:
    default: true

    workspace:
      host: https://dbc-1750318a-76a9.cloud.databricks.com
      root_path: /Workspace/Users/parvinbadalov@yahoo.com/.bundle/${bundle.name}/personal

    run_as:
      user_name: parvinbadalov@yahoo.com

    variables:
      lab05_catalog: "dbr_dev"
      lab05_schema: "parvinbadalov"

      lab06_warehouse_id: "410e5f3b4784e981"
      lab06_alert_subscriber_email: "parvinbadalov@yahoo.com"
      lab06_alert_parent_path: "/Workspace/Users/parvinbadalov@yahoo.com/Drafts"

      lab07_catalog: "dbr_dev"
      lab07_schema: "parvinbadalov"
      lab07_warehouse_id: "410e5f3b4784e981"

    resources:
      jobs:
        lab05_lakeflow_job:
          tasks:
            - task_key: produce_status_snapshot
              environment_key: default

      pipelines:
        lab07_quality_pipeline:
          channel: CURRENT

  # ===================================================================
  # PERSONAL - PRODUCTION TEST
  # ===================================================================
  personal_prod:
    mode: production

    workspace:
      host: https://dbc-1750318a-76a9.cloud.databricks.com
      root_path: /Workspace/Users/parvinbadalov@yahoo.com/.bundle/${bundle.name}/personal_prod

    git:
      branch: main

    run_as:
      user_name: parvinbadalov@yahoo.com

    permissions:
      - level: CAN_MANAGE
        user_name: parvinbadalov@yahoo.com

    variables:
      lab05_catalog: "dbr_dev"
      lab05_schema: "parvinbadalov_lab05_prod"

      lab06_warehouse_id: "410e5f3b4784e981"
      lab06_alert_subscriber_email: "parvinbadalov@yahoo.com"
      lab06_alert_parent_path: "/Workspace/Users/parvinbadalov@yahoo.com/Drafts"

      lab07_warehouse_id: "410e5f3b4784e981"

    resources:
      jobs:
        lab05_lakeflow_job:
          tasks:
            - task_key: produce_status_snapshot
              environment_key: default