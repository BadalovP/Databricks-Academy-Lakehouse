resources:
  pipelines:
    urbanflow_pipeline:
      name: "[${bundle.target}] urbanflow_pipeline"
      catalog: ${var.catalog}
      # ISOLATED: never ${var.schema}, which the validated notebook tables live in.
      schema: ${var.lakeflow_schema}
      root_path: ../src
      serverless: true
      # Triggered, never continuous. A continuous pipeline bills for as long as it runs; a
      # triggered one does its bounded update and stops, which is the only mode this project
      # is authorized to use.
      continuous: false
      # `development` is deliberately NOT set here: the azure target runs in production mode,
      # which rejects a development pipeline outright. Each target decides its own mode.
      channel: CURRENT
      edition: ADVANCED
      configuration:
        urbanflow.catalog: ${var.catalog}
        urbanflow.schema: ${var.lakeflow_schema}
        urbanflow.volume: ${var.volume}
        # The Kafka retention window no longer contains the validated execution. Lakeflow
        # stream-reads the preserved append-only Bronze Delta table instead of republishing it.
        urbanflow.station_bronze_source_table: >-
          ${var.catalog}.${var.schema}.bronze_station_status
        # Reference data is read from the validated imperative path and copied into the
        # pipeline-owned schema. The source table is never modified.
        urbanflow.station_reference_source_table: >-
          ${var.catalog}.${var.schema}.dim_station_development_sample
        # Shared with the notebook path so a threshold is never defined in two places.
        urbanflow.low_bike_threshold: "2"
        urbanflow.low_dock_threshold: "2"
      libraries:
        - file:
            path: ../pipeline/bronze.py
        - file:
            path: ../pipeline/silver.py
        - file:
            path: ../pipeline/gold.py
