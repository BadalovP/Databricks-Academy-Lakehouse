resources:
  jobs:
    urbanflow_bounded_stream_test:
      name: "[${bundle.target}] urbanflow_bounded_stream_test"
      max_concurrent_runs: 1
      # Outer ceiling for the whole task; the notebook's own wait bound must stay below it.
      timeout_seconds: 1200
      parameters:
        - name: run_stream
          default: "false"
        - name: secret_scope
          default: ${var.secret_scope}
        - name: execution_id
          default: NOT_APPROVED
        - name: expected_published_events
          default: "0"
        - name: expected_source_last_updated
          default: "0"
        - name: starting_offsets
          default: earliest
        - name: stream_timeout_seconds
          default: "900"
        # Target isolation: the deployed target's own storage, not the committed default.
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: volume
          default: ${var.volume}
      tasks:
        - task_key: bounded_event_hubs_stream
          existing_cluster_id: ${var.compute_cluster_id}
          notebook_task:
            notebook_path: ../notebooks/03_eventhubs_to_bronze.py
            base_parameters:
              run_stream: "{{job.parameters.run_stream}}"
              secret_scope: "{{job.parameters.secret_scope}}"
              execution_id: "{{job.parameters.execution_id}}"
              expected_published_events: "{{job.parameters.expected_published_events}}"
              expected_source_last_updated: "{{job.parameters.expected_source_last_updated}}"
              starting_offsets: "{{job.parameters.starting_offsets}}"
              stream_timeout_seconds: "{{job.parameters.stream_timeout_seconds}}"
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"
              volume: "{{job.parameters.volume}}"
      tags:
        project: urbanflow
        compute: existing_shared_cluster
        safety: requires_already_running_cluster

    urbanflow_silver_gold_test:
      name: "[${bundle.target}] urbanflow_silver_gold_test"
      max_concurrent_runs: 1
      timeout_seconds: 1200
      parameters:
        - name: run_transform
          default: "false"
        # Unique per run, so a repeat never overwrites the previous run's evidence.
        - name: run_attempt_id
          default: "{{job.run_id}}"
        - name: source_execution_id
          default: urbanflow-20260929T195132Z-r3
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: volume
          default: ${var.volume}
      tasks:
        - task_key: bronze_to_silver
          existing_cluster_id: ${var.compute_cluster_id}
          timeout_seconds: 600
          notebook_task:
            notebook_path: ../notebooks/04_bronze_to_silver.py
            base_parameters:
              run_transform: "{{job.parameters.run_transform}}"
              run_attempt_id: "{{job.parameters.run_attempt_id}}"
              source_execution_id: "{{job.parameters.source_execution_id}}"
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"
              volume: "{{job.parameters.volume}}"
        - task_key: silver_to_gold
          depends_on:
            - task_key: bronze_to_silver
          existing_cluster_id: ${var.compute_cluster_id}
          timeout_seconds: 600
          notebook_task:
            notebook_path: ../notebooks/05_silver_to_gold.py
            base_parameters:
              run_transform: "{{job.parameters.run_transform}}"
              run_attempt_id: "{{job.parameters.run_attempt_id}}"
              source_execution_id: "{{job.parameters.source_execution_id}}"
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"
              volume: "{{job.parameters.volume}}"
      tags:
        project: urbanflow
        phase: silver_gold
        compute: existing_shared_cluster
        safety: dry_run_by_default

    # Phase 3 Jobs. Both are PREPARED, unscheduled, and fail closed: the run gate defaults to
    # "false", so a deploy or an accidental trigger exits before reading or writing anything.
    # Neither creates compute; both attach to the already-running approved cluster.
    urbanflow_historical_trips_test:
      name: "[${bundle.target}] urbanflow_historical_trips_test"
      max_concurrent_runs: 1
      # Outer ceiling; the notebook's own availableNow wait bound stays below it.
      timeout_seconds: 1800
      parameters:
        - name: run_ingest
          default: "false"
        # Unique per run, so a repeat never overwrites the previous run's evidence.
        - name: run_attempt_id
          default: "{{job.run_id}}"
        - name: execution_id
          default: NOT_APPROVED
        - name: stream_timeout_seconds
          default: "900"
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: volume
          default: ${var.volume}
        # Empty preserves the already-validated sample paths. The monthly run uses 202401-full.
        - name: landing_subdir
          default: ""
      tasks:
        - task_key: historical_trips_autoloader
          existing_cluster_id: ${var.compute_cluster_id}
          timeout_seconds: 1500
          notebook_task:
            notebook_path: ../notebooks/06_historical_trips.py
            base_parameters:
              run_ingest: "{{job.parameters.run_ingest}}"
              run_attempt_id: "{{job.parameters.run_attempt_id}}"
              execution_id: "{{job.parameters.execution_id}}"
              stream_timeout_seconds: "{{job.parameters.stream_timeout_seconds}}"
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"
              volume: "{{job.parameters.volume}}"
              landing_subdir: "{{job.parameters.landing_subdir}}"
      tags:
        project: urbanflow
        phase: historical
        compute: existing_shared_cluster
        safety: dry_run_by_default

    urbanflow_weather_enrichment_test:
      name: "[${bundle.target}] urbanflow_weather_enrichment_test"
      max_concurrent_runs: 1
      timeout_seconds: 900
      parameters:
        - name: run_enrichment
          default: "false"
        # Unique per run, so a repeat never overwrites the previous run's evidence.
        - name: run_attempt_id
          default: "{{job.run_id}}"
        - name: execution_id
          default: NOT_APPROVED
        # Select exactly one trip lineage so sample and full-month rows are never combined.
        - name: source_execution_id
          default: urbanflow-hist-devsample40-20261002T0010Z
        # Default to the committed 48-hour sample so a run makes no external request.
        - name: weather_source
          default: sample_json
        - name: weather_sample_file
          default: open_meteo_archive_202401.sample.json
        # The window is bounded; the notebook refuses anything above 62 days. These dates
        # match the committed sample's coverage.
        - name: start_date
          default: "2024-01-24"
        - name: end_date
          default: "2024-01-25"
        - name: latitude
          default: "40.7128"
        - name: longitude
          default: "-74.0060"
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: volume
          default: ${var.volume}
      tasks:
        - task_key: weather_enrichment
          existing_cluster_id: ${var.compute_cluster_id}
          timeout_seconds: 600
          notebook_task:
            notebook_path: ../notebooks/07_weather_enrichment.py
            base_parameters:
              run_enrichment: "{{job.parameters.run_enrichment}}"
              run_attempt_id: "{{job.parameters.run_attempt_id}}"
              execution_id: "{{job.parameters.execution_id}}"
              source_execution_id: "{{job.parameters.source_execution_id}}"
              weather_source: "{{job.parameters.weather_source}}"
              weather_sample_file: "{{job.parameters.weather_sample_file}}"
              start_date: "{{job.parameters.start_date}}"
              end_date: "{{job.parameters.end_date}}"
              latitude: "{{job.parameters.latitude}}"
              longitude: "{{job.parameters.longitude}}"
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"
              volume: "{{job.parameters.volume}}"
      tags:
        project: urbanflow
        phase: weather
        compute: existing_shared_cluster
        safety: dry_run_by_default

    # Primary user-facing orchestrator. It deliberately excludes the Event Hubs producer:
    # the station branch starts from the already-validated Bronze execution instead of
    # republishing messages whose retention window has passed.
    urbanflow_end_to_end:
      name: "[${bundle.target}] UrbanFlow End-to-End"
      max_concurrent_runs: 1
      # The sample normally finishes much sooner. The 90-minute outer bound leaves enough room
      # for the separately approved January archive plus weather and final validation without
      # allowing a shared-cluster run to remain open indefinitely.
      timeout_seconds: 5400
      parameters:
        - name: run_station_pipeline
          default: "true"
        - name: run_historical
          default: "true"
        - name: run_weather
          default: "true"
        - name: run_full_month
          default: "false"
        - name: source_execution_id
          default: urbanflow-20260929T195132Z-r3
        - name: run_attempt_id
          default: "{{job.run_id}}"
        - name: historical_execution_id
          default: urbanflow-hist-devsample40-20261002T0010Z
        - name: historical_landing_subdir
          default: ""
        - name: weather_execution_id
          default: urbanflow-weather-devsample48h-20261002T0015Z
        - name: weather_source
          default: sample_json
        - name: weather_sample_file
          default: open_meteo_archive_202401.sample.json
        - name: weather_start_date
          default: "2024-01-24"
        - name: weather_end_date
          default: "2024-01-25"
        - name: stream_timeout_seconds
          default: "900"
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: volume
          default: ${var.volume}
      tasks:
        - task_key: 01_preflight
          existing_cluster_id: 0702-132442-toro5spu
          timeout_seconds: 300
          notebook_task:
            notebook_path: ../notebooks/08_unified_preflight.py
            base_parameters:
              run_station_pipeline: "{{job.parameters.run_station_pipeline}}"
              run_historical: "{{job.parameters.run_historical}}"
              run_weather: "{{job.parameters.run_weather}}"
              run_full_month: "{{job.parameters.run_full_month}}"
              source_execution_id: "{{job.parameters.source_execution_id}}"
              historical_execution_id: "{{job.parameters.historical_execution_id}}"
              historical_landing_subdir: "{{job.parameters.historical_landing_subdir}}"
              weather_execution_id: "{{job.parameters.weather_execution_id}}"
              weather_source: "{{job.parameters.weather_source}}"
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"
              volume: "{{job.parameters.volume}}"

        - task_key: 02_station_source_check
          depends_on:
            - task_key: 01_preflight
          existing_cluster_id: 0702-132442-toro5spu
          timeout_seconds: 600
          notebook_task:
            notebook_path: ../notebooks/09_station_source_check.py
            base_parameters:
              run_station_pipeline: "{{job.parameters.run_station_pipeline}}"
              source_execution_id: "{{job.parameters.source_execution_id}}"
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"

        - task_key: 03_station_silver
          depends_on:
            - task_key: 02_station_source_check
          existing_cluster_id: 0702-132442-toro5spu
          timeout_seconds: 600
          notebook_task:
            notebook_path: ../notebooks/04_bronze_to_silver.py
            base_parameters:
              run_transform: "{{job.parameters.run_station_pipeline}}"
              run_attempt_id: "{{job.parameters.run_attempt_id}}"
              source_execution_id: "{{job.parameters.source_execution_id}}"
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"
              volume: "{{job.parameters.volume}}"

        - task_key: 04_station_gold
          depends_on:
            - task_key: 03_station_silver
          existing_cluster_id: 0702-132442-toro5spu
          timeout_seconds: 600
          notebook_task:
            notebook_path: ../notebooks/05_silver_to_gold.py
            base_parameters:
              run_transform: "{{job.parameters.run_station_pipeline}}"
              run_attempt_id: "{{job.parameters.run_attempt_id}}"
              source_execution_id: "{{job.parameters.source_execution_id}}"
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"
              volume: "{{job.parameters.volume}}"

        - task_key: 05_historical_trips
          depends_on:
            - task_key: 01_preflight
          existing_cluster_id: 0702-132442-toro5spu
          # Full-month Auto Loader gets a 45-minute internal wait; leave another 15 minutes for
          # reconciliation and the execution-scoped Delta writes that follow the stream.
          timeout_seconds: 3600
          notebook_task:
            notebook_path: ../notebooks/06_historical_trips.py
            base_parameters:
              run_ingest: "{{job.parameters.run_historical}}"
              run_attempt_id: "{{job.parameters.run_attempt_id}}"
              execution_id: "{{job.parameters.historical_execution_id}}"
              stream_timeout_seconds: "{{job.parameters.stream_timeout_seconds}}"
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"
              volume: "{{job.parameters.volume}}"
              landing_subdir: "{{job.parameters.historical_landing_subdir}}"

        - task_key: 06_weather_enrichment
          depends_on:
            - task_key: 05_historical_trips
          existing_cluster_id: 0702-132442-toro5spu
          timeout_seconds: 600
          notebook_task:
            notebook_path: ../notebooks/07_weather_enrichment.py
            base_parameters:
              run_enrichment: "{{job.parameters.run_weather}}"
              run_attempt_id: "{{job.parameters.run_attempt_id}}"
              execution_id: "{{job.parameters.weather_execution_id}}"
              # Not `source_execution_id`: that job parameter (the station execution) would
              # override a task parameter of the same name.
              historical_execution_id: "{{job.parameters.historical_execution_id}}"
              weather_source: "{{job.parameters.weather_source}}"
              weather_sample_file: "{{job.parameters.weather_sample_file}}"
              start_date: "{{job.parameters.weather_start_date}}"
              end_date: "{{job.parameters.weather_end_date}}"
              latitude: "40.7128"
              longitude: "-74.0060"
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"
              volume: "{{job.parameters.volume}}"

        - task_key: 07_final_validation
          depends_on:
            - task_key: 04_station_gold
            - task_key: 05_historical_trips
            - task_key: 06_weather_enrichment
          existing_cluster_id: 0702-132442-toro5spu
          timeout_seconds: 900
          notebook_task:
            notebook_path: ../notebooks/10_unified_final_validation.py
            base_parameters:
              run_station_pipeline: "{{job.parameters.run_station_pipeline}}"
              run_historical: "{{job.parameters.run_historical}}"
              run_weather: "{{job.parameters.run_weather}}"
              run_full_month: "{{job.parameters.run_full_month}}"
              source_execution_id: "{{job.parameters.source_execution_id}}"
              historical_execution_id: "{{job.parameters.historical_execution_id}}"
              weather_execution_id: "{{job.parameters.weather_execution_id}}"
              weather_start_date: "{{job.parameters.weather_start_date}}"
              weather_end_date: "{{job.parameters.weather_end_date}}"
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"
      tags:
        project: urbanflow
        role: primary_orchestrator
        compute: existing_gp1_only
        event_hubs_producer: excluded
        release: protected_manual_only
