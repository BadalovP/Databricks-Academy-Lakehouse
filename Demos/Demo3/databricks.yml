bundle:
  name: demo3_urbanflow

include:
  - resources/*.yml

variables:
  workspace_user:
    description: Workspace user whose folder contains the bundle files.
    default: parvinbadalov@softserve.academy
  catalog:
    default: dbr_dev
  schema:
    default: parvinbadalov_urbanflow
  volume:
    default: urbanflow_landing
  compute_cluster_id:
    description: Existing shared cluster for notebook tasks; GP1 is preferred after read-only verification.
    default: 0702-132442-toro5spu
  secret_scope:
    description: Existing Key Vault-backed Databricks secret scope.
    default: azure-secrets

sync:
  include:
    - notebooks/**
    - pipeline/**
    - sql/**
    - src/**
    - config/**
    - data/samples/**

targets:
  dev:
    default: true
    mode: development
    workspace:
      host: https://adb-7405604503619901.1.azuredatabricks.net
      root_path: /Workspace/Users/${var.workspace_user}/.bundle/${bundle.name}/${bundle.target}
    variables:
      schema: parvinbadalov_urbanflow_dev

  azure:
    mode: production
    workspace:
      host: https://adb-7405604503619901.1.azuredatabricks.net
      root_path: /Workspace/Users/${var.workspace_user}/.bundle/${bundle.name}/${bundle.target}
