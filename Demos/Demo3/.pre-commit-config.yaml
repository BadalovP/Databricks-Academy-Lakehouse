repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff check
        entry: ruff check
        language: system
        types: [python]
        files: ^Demos/Demo3/
      - id: black-check
        name: Black check
        entry: black --check
        language: system
        types: [python]
        files: ^Demos/Demo3/
      - id: pytest
        name: UrbanFlow unit tests
        entry: python -m pytest -q Demos/Demo3/tests
        language: system
        pass_filenames: false
        always_run: true
