resources:
  jobs:
    demo2_olist_end_to_end_workflow:
      name: Demo2 Olist End-to-End Workflow

      parameters:
        - name: expected_order_item_rows
          default: "112650"

        - name: expected_distinct_orders
          default: "98666"

        - name: expected_status_count
          default: "7"

        - name: expected_total_price
          default: "13591643.70"

        - name: expected_total_freight
          default: "2251909.54"

        - name: expected_total_value
          default: "15843553.24"

        - name: expected_quality_status
          default: "PASS"

      tasks:
        - task_key: run_olist_pipeline
          pipeline_task:
            pipeline_id: ${var.demo2_pipeline_id}
            full_refresh: false

        - task_key: validate_pipeline_outputs
          depends_on:
            - task_key: run_olist_pipeline

          spark_python_task:
            python_file: "../pipeline/Olist Test/tests/validate_pipeline_outputs.py"
            parameters:
              - "--catalog=${var.demo2_catalog}"
              - "--schema=${var.demo2_schema}"
              - "--expected-order-item-rows={{job.parameters.expected_order_item_rows}}"
              - "--expected-distinct-orders={{job.parameters.expected_distinct_orders}}"
              - "--expected-status-count={{job.parameters.expected_status_count}}"
              - "--expected-total-price={{job.parameters.expected_total_price}}"
              - "--expected-total-freight={{job.parameters.expected_total_freight}}"
              - "--expected-total-value={{job.parameters.expected_total_value}}"
              - "--expected-quality-status={{job.parameters.expected_quality_status}}"

          existing_cluster_id: ${var.demo2_cluster_id}

        - task_key: refresh_olist_dashboard
          depends_on:
            - task_key: validate_pipeline_outputs

          dashboard_task:
            dashboard_id: ${var.demo2_dashboard_id}
            warehouse_id: ${var.demo2_warehouse_id}
            subscription: {}

      queue:
        enabled: true

      max_concurrent_runs: 1