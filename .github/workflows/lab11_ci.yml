name: Lab 11 - Zerobus CI

on:
  pull_request:
    paths:
      - "labs/lab_11_zerobus/**"
      - ".github/workflows/lab11_ci.yml"
  push:
    branches: [main]
    paths:
      - "labs/lab_11_zerobus/**"
      - ".github/workflows/lab11_ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lab11-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-validation:
    name: Offline lint, tests and static checks (no Databricks access)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: labs/lab_11_zerobus
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: labs/lab_11_zerobus/pyproject.toml
      - name: Install the package, the Zerobus SDK (interface checks only) and dev tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[zerobus,dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Pytest (offline; fakes for the SDK, DuckDB for the SQL)
        run: pytest -v
      - name: Producer dry run (validates the full plan; no network writes)
        run: python scripts/run_producer.py --target personal_dev --run-id ci-dry-run --dry-run
