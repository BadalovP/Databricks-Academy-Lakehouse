# LAB 08 - TravelOps
#
# Pull requests stop after quality and bundle validation, plus read-only
# Terraform plans when advanced OIDC mode is enabled (terraform-plan keeps
# using the unprotected `azure-prod` environment so ordinary PR validation
# is never blocked). Pushes to main promote Personal DEV automatically, then
# require manual approval (via a required-reviewers rule on the
# `personal-prod-approval` environment, configured outside this file) before
# Personal PROD deploys, then select the advanced OIDC/Terraform Azure path
# or a temporary PAT-only Azure deployment path -- both of which also
# require manual approval via a required-reviewers rule on the shared
# `azure-release-approval` environment before either one deploys or applies
# Terraform. Existing `personal-prod`/`azure-prod` environment names and the
# Azure OIDC federated-credential subject are left unchanged by this gating.
#
# On a push to main, `detect-changes` classifies the files that actually
# changed: top-level `*.md` docs and anything under `evidence/` in this lab,
# and this workflow file itself, never require a deployment on their own.
# `deploy-personal-dev` (and therefore the entire rest of the deploy chain,
# which depends on it transitively) only runs when at least one other file
# under `labs/lab_08_cicd_travelops/**` or `.github/terraform/**` also
# changed in the same push. Unit Tests, Bundle Validate and (for a pull
# request) the read-only Terraform Plan are unaffected and still validate
# every change, including documentation-only and workflow-only ones.
#
# A manual `workflow_dispatch` run on `main` deliberately bypasses that
# change-detection guard (a human explicitly asked for a full run), but
# every other safeguard stays exactly as it is for a push: Personal PROD
# approval, the Azure release approval, all Terraform safety checks, and
# the OIDC-only Azure path (the temporary PAT path stays push-only and,
# being gated on `LAB08_ENABLE_AZURE_OIDC == 'false'`, never runs alongside
# it while that variable is `true`). The `run_azure_prod_job` input controls
# only the final Azure PROD job-run step for that one dispatched run; it
# never reads or writes the `LAB08_RUN_AZURE_PROD_JOB` repository variable,
# which continues to control that same step exactly as before on an
# ordinary push.
name: LAB 08 TravelOps CI/CD

on:
  pull_request:
    paths:
      - "labs/lab_08_cicd_travelops/**"
      - ".github/workflows/lab08_cicd.yml"
      - ".github/terraform/**"
  push:
    branches: [main]
    paths:
      - "labs/lab_08_cicd_travelops/**"
      - ".github/workflows/lab08_cicd.yml"
      - ".github/terraform/**"
  workflow_dispatch:
    inputs:
      run_azure_prod_job:
        description: >-
          Run the final Azure PROD job after successful Azure deployment and
          validation. This demonstration deploys and runs Personal DEV and
          Personal PROD, and applies/deploys Azure PROD, regardless of this
          setting -- it repeats real jobs and incurs real compute costs on
          all three targets. Leave false to demonstrate the full pipeline
          without the final Azure PROD job execution.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: lab08-travelops-${{ github.ref }}
  cancel-in-progress: false

env:
  LAB08_ROOT: labs/lab_08_cicd_travelops
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  manual-dispatch-notice:
    name: Manual Dispatch Cost Warning
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Warn about repeated jobs and compute cost
        run: |
          echo "::warning::This manual run repeats the same Deploy DEV, Deploy Personal PROD, Terraform Apply and Deploy Azure PROD jobs an ordinary push to main would run, and incurs the same real compute costs on Personal DEV, Personal PROD and Azure PROD. run_azure_prod_job=${{ inputs.run_azure_prod_job }} additionally controls only the final Azure PROD job-run step; every approval gate still applies."

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: labs/lab_08_cicd_travelops
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . -r requirements-dev.txt
      - name: Ruff
        run: ruff check .
      - name: Black
        run: black --check .
      - name: Pytest
        run: pytest

  bundle-validate:
    name: Bundle Validate
    needs: unit-tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: labs/lab_08_cicd_travelops
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - name: Validate Personal DEV and PROD
        env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_PERSONAL_HOST || 'https://dbc-1750318a-76a9.cloud.databricks.com' }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_PERSONAL_TOKEN }}
        run: |
          databricks bundle validate --strict -t personal_dev
          databricks bundle validate --strict -t personal_prod

  detect-changes:
    name: Detect Deployable Changes
    # Runs (and must succeed) for both events this feeds: push and
    # workflow_dispatch. GitHub Actions implicitly ANDs a success() check
    # onto deploy-personal-dev's `if:` below, because that expression does
    # not itself call success()/failure()/cancelled()/always() -- so if this
    # job were skipped (as it previously was for workflow_dispatch), the
    # implicit success() would evaluate to false and silently skip
    # deploy-personal-dev even when its own condition was true. Always
    # completing this job with a real (never "skipped") result for both
    # relevant events avoids relying on always() everywhere downstream.
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'
    needs: bundle-validate
    runs-on: ubuntu-latest
    outputs:
      deploy_needed: ${{ steps.filter.outputs.deploy_needed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify changed files (docs/evidence/workflow-only vs. deployable)
        id: filter
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "Manual workflow_dispatch run: deploying explicitly requested, skipping file classification."
            echo "deploy_needed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "${{ github.event.before }}" "${{ github.event.after }}")"
          echo "Changed files in this push:"
          echo "$changed"
          deploy_needed=false
          while IFS= read -r f; do
            [[ -z "$f" ]] && continue
            case "$f" in
              labs/lab_08_cicd_travelops/*.md) ;;
              labs/lab_08_cicd_travelops/evidence/*) ;;
              .github/workflows/lab08_cicd.yml) ;;
              labs/lab_08_cicd_travelops/*|.github/terraform/*) deploy_needed=true ;;
            esac
          done <<< "$changed"
          echo "deploy_needed=$deploy_needed" >> "$GITHUB_OUTPUT"
          echo "deploy_needed=$deploy_needed"

  deploy-personal-dev:
    name: Deploy DEV
    # detect-changes now always runs (and must succeed) for both push and
    # workflow_dispatch, so this plain AND-chain is sufficient: GitHub's
    # implicit success() check on [bundle-validate, detect-changes] and this
    # explicit condition agree in every case. See detect-changes' comment
    # for why a job-specific OR-branch previously bypassed that implicit
    # check incorrectly.
    if: >-
      github.ref == 'refs/heads/main' &&
      needs.bundle-validate.result == 'success' &&
      needs.detect-changes.result == 'success' &&
      needs.detect-changes.outputs.deploy_needed == 'true'
    needs: [bundle-validate, detect-changes]
    runs-on: ubuntu-latest
    environment: personal-dev
    defaults:
      run:
        working-directory: labs/lab_08_cicd_travelops
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - name: Deploy and run Personal DEV
        env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_PERSONAL_HOST || 'https://dbc-1750318a-76a9.cloud.databricks.com' }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_PERSONAL_TOKEN }}
        run: |
          databricks bundle deploy -t personal_dev
          databricks bundle run travelops_promotion_job -t personal_dev

  validate-personal-dev:
    name: Validate DEV
    needs: deploy-personal-dev
    runs-on: ubuntu-latest
    environment: personal-dev
    defaults:
      run:
        working-directory: labs/lab_08_cicd_travelops
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - name: Require unchanged Personal DEV bundle
        env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_PERSONAL_HOST || 'https://dbc-1750318a-76a9.cloud.databricks.com' }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_PERSONAL_TOKEN }}
        run: |
          databricks bundle plan -t personal_dev | tee personal-dev-plan.txt
          grep -Fq "Plan: 0 to add, 0 to change, 0 to delete" personal-dev-plan.txt

  deploy-personal-prod:
    name: Deploy Personal PROD
    needs: approve-personal-prod
    runs-on: ubuntu-latest
    environment: personal-prod
    defaults:
      run:
        working-directory: labs/lab_08_cicd_travelops
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - name: Deploy and run Personal PROD
        env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_PERSONAL_HOST || 'https://dbc-1750318a-76a9.cloud.databricks.com' }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_PERSONAL_TOKEN }}
        run: |
          databricks bundle deploy -t personal_prod
          databricks bundle run travelops_promotion_job -t personal_prod

  validate-personal-prod:
    name: Validate Personal PROD
    needs: deploy-personal-prod
    runs-on: ubuntu-latest
    environment: personal-prod
    defaults:
      run:
        working-directory: labs/lab_08_cicd_travelops
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - name: Require unchanged Personal PROD bundle
        env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_PERSONAL_HOST || 'https://dbc-1750318a-76a9.cloud.databricks.com' }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_PERSONAL_TOKEN }}
        run: |
          databricks bundle plan -t personal_prod | tee personal-prod-plan.txt
          grep -Fq "Plan: 0 to add, 0 to change, 0 to delete" personal-prod-plan.txt

  approve-personal-prod:
    name: Approve Personal PROD Deployment
    needs: validate-personal-dev
    runs-on: ubuntu-latest
    environment: personal-prod-approval
    steps:
      - name: Approved
        run: echo "Personal PROD deployment approved."

  terraform-plan:
    name: Terraform Plan
    if: >-
      always() &&
      vars.LAB08_ENABLE_AZURE_OIDC == 'true' &&
      needs.bundle-validate.result == 'success' &&
      (github.event_name == 'pull_request' || needs.validate-personal-prod.result == 'success')
    needs: [bundle-validate, validate-personal-prod]
    runs-on: ubuntu-latest
    environment: azure-prod
    permissions:
      contents: read
      id-token: write
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_AZUREAD: "true"
      ARM_USE_OIDC: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Stage roots with Azure Blob remote state
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/lab08-personal" "$RUNNER_TEMP/lab08-azure-prod"
          cp "$LAB08_ROOT"/terraform/personal/{main,outputs,variables,versions}.tf "$RUNNER_TEMP/lab08-personal/"
          cp "$LAB08_ROOT"/terraform/azure-prod/{main,outputs,variables,versions}.tf "$RUNNER_TEMP/lab08-azure-prod/"
          cp .github/terraform/lab08-azurerm-backend.tf "$RUNNER_TEMP/lab08-personal/backend.tf"
          cp .github/terraform/lab08-azurerm-backend.tf "$RUNNER_TEMP/lab08-azure-prod/backend.tf"
      - name: Personal Terraform validate and no-change plan
        env:
          DATABRICKS_AUTH_TYPE: pat
          DATABRICKS_HOST: ${{ vars.DATABRICKS_PERSONAL_HOST || 'https://dbc-1750318a-76a9.cloud.databricks.com' }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_PERSONAL_TOKEN }}
          TF_VAR_databricks_profile: ""
        shell: bash
        run: |
          terraform -chdir="$LAB08_ROOT/terraform/personal" fmt -check
          terraform -chdir="$RUNNER_TEMP/lab08-personal" init -input=false \
            -backend-config="resource_group_name=${{ vars.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.TF_STATE_CONTAINER }}" \
            -backend-config="key=lab08/personal.tfstate"
          terraform -chdir="$RUNNER_TEMP/lab08-personal" validate
          personal_state="$(terraform -chdir="$RUNNER_TEMP/lab08-personal" state list)"
          for address in \
            databricks_volume.personal_dev_raw \
            databricks_volume.personal_prod_raw \
            databricks_grants.personal_dev_raw \
            databricks_grants.personal_prod_raw; do
            grep -Fxq "$address" <<<"$personal_state" || {
              echo "Remote Personal state is missing $address; refusing an unsafe plan."
              exit 1
            }
          done
          set +e
          terraform -chdir="$RUNNER_TEMP/lab08-personal" plan -no-color -detailed-exitcode \
            -out="$RUNNER_TEMP/lab08-personal.tfplan" | tee "$RUNNER_TEMP/personal-plan.txt"
          plan_code=${PIPESTATUS[0]}
          set -e
          if [[ $plan_code -ne 0 ]]; then
            echo "Personal Terraform must remain unchanged; exit code was $plan_code."
            exit 1
          fi
      - name: Azure PROD Terraform validate and safe plan
        env:
          DATABRICKS_AUTH_TYPE: azure-cli
          DATABRICKS_HOST: ${{ vars.DATABRICKS_AZURE_HOST }}
          TF_VAR_databricks_profile: ""
          TF_VAR_resource_group_name: ${{ vars.LAB08_RESOURCE_GROUP_NAME }}
          LAB08_EXPECTED_AZURE_STORAGE_ACCOUNT_NAME: ${{ vars.LAB08_AZURE_STORAGE_ACCOUNT_NAME }}
        shell: bash
        run: |
          terraform -chdir="$LAB08_ROOT/terraform/azure-prod" fmt -check
          terraform -chdir="$RUNNER_TEMP/lab08-azure-prod" init -input=false \
            -backend-config="resource_group_name=${{ vars.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.TF_STATE_CONTAINER }}" \
            -backend-config="key=lab08/azure-prod.tfstate"
          terraform -chdir="$RUNNER_TEMP/lab08-azure-prod" validate
          azure_state="$(terraform -chdir="$RUNNER_TEMP/lab08-azure-prod" state list)"
          for address in \
            azurerm_storage_account.raw \
            azurerm_storage_data_lake_gen2_filesystem.raw \
            azurerm_databricks_access_connector.uc \
            azurerm_role_assignment.uc_storage_blob_data_contributor \
            databricks_storage_credential.raw \
            databricks_external_location.raw \
            databricks_volume.azure_prod_raw \
            databricks_grant.azure_prod_raw_volume_rw \
            databricks_schema.travelops_prod; do
            grep -Fxq "$address" <<<"$azure_state" || {
              echo "Remote Azure PROD state is missing $address; refusing an unsafe plan."
              exit 1
            }
          done
          actual_storage_account="$(terraform -chdir="$RUNNER_TEMP/lab08-azure-prod" output -raw storage_account_name)"
          [[ $actual_storage_account == "$LAB08_EXPECTED_AZURE_STORAGE_ACCOUNT_NAME" ]] || {
            echo "Azure PROD remote state points to unexpected storage account: $actual_storage_account"
            exit 1
          }
          set +e
          terraform -chdir="$RUNNER_TEMP/lab08-azure-prod" plan -no-color -detailed-exitcode \
            -out="$RUNNER_TEMP/azure-prod.tfplan" | tee "$RUNNER_TEMP/azure-prod-plan.txt"
          plan_code=${PIPESTATUS[0]}
          set -e
          [[ $plan_code -eq 0 || $plan_code -eq 2 ]] || exit "$plan_code"
          terraform -chdir="$RUNNER_TEMP/lab08-azure-prod" show -json \
            "$RUNNER_TEMP/azure-prod.tfplan" > "$RUNNER_TEMP/azure-prod-plan.json"
          rbac_actions="$(jq -r '
            first(.resource_changes[]? |
              select(.address == "azurerm_role_assignment.uc_storage_blob_data_contributor") |
              .change.actions | join(",")) // "missing"
          ' "$RUNNER_TEMP/azure-prod-plan.json")"
          if [[ $rbac_actions != "no-op" ]]; then
            echo "The existing Access Connector RBAC assignment would change, but the GitHub managed identity does not have RBAC administration permission. Refusing apply."
            echo "Planned RBAC actions: $rbac_actions"
            exit 1
          fi
          while IFS=$'\t' read -r address actions; do
            case "$address:$actions" in
              azurerm_role_assignment.uc_storage_blob_data_contributor:create) ;;
              databricks_external_location.raw:create) ;;
              databricks_volume.azure_prod_raw:create) ;;
              databricks_grant.azure_prod_raw_volume_rw:create) ;;
              *) echo "Unsafe or unintended Azure PROD change: $address [$actions]"; exit 1 ;;
            esac
          done < <(jq -r '.resource_changes[]? | select(.change.actions != ["no-op"]) | [.address, (.change.actions | join(","))] | @tsv' "$RUNNER_TEMP/azure-prod-plan.json")
      - name: Upload sanitized plan evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab08-terraform-plans-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/personal-plan.txt
            ${{ runner.temp }}/azure-prod-plan.txt
          if-no-files-found: warn

  approve-azure-release:
    name: Approve Azure Release (Terraform Apply)
    if: >-
      needs.terraform-plan.result == 'success' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' &&
      vars.LAB08_ENABLE_AZURE_OIDC == 'true'
    needs: terraform-plan
    runs-on: ubuntu-latest
    environment: azure-release-approval
    steps:
      - name: Approved
        run: echo "Azure PROD Terraform Apply and deployment approved."

  terraform-apply:
    name: Terraform Apply
    if: >-
      needs.approve-azure-release.result == 'success' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' &&
      vars.LAB08_ENABLE_AZURE_OIDC == 'true'
    needs: approve-azure-release
    runs-on: ubuntu-latest
    environment: azure-prod
    permissions:
      contents: read
      id-token: write
    outputs:
      storage_account_name: ${{ steps.tf-output.outputs.storage_account_name }}
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_AZUREAD: "true"
      ARM_USE_OIDC: "true"
      DATABRICKS_AUTH_TYPE: azure-cli
      DATABRICKS_HOST: ${{ vars.DATABRICKS_AZURE_HOST }}
      TF_VAR_databricks_profile: ""
      TF_VAR_resource_group_name: ${{ vars.LAB08_RESOURCE_GROUP_NAME }}
      LAB08_EXPECTED_AZURE_STORAGE_ACCOUNT_NAME: ${{ vars.LAB08_AZURE_STORAGE_ACCOUNT_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Fresh safe plan, apply, and idempotency
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/lab08-azure-prod"
          cp "$LAB08_ROOT"/terraform/azure-prod/{main,outputs,variables,versions}.tf "$RUNNER_TEMP/lab08-azure-prod/"
          cp .github/terraform/lab08-azurerm-backend.tf "$RUNNER_TEMP/lab08-azure-prod/backend.tf"
          terraform -chdir="$RUNNER_TEMP/lab08-azure-prod" init -input=false \
            -backend-config="resource_group_name=${{ vars.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.TF_STATE_CONTAINER }}" \
            -backend-config="key=lab08/azure-prod.tfstate"
          azure_state="$(terraform -chdir="$RUNNER_TEMP/lab08-azure-prod" state list)"
          for address in \
            azurerm_storage_account.raw \
            azurerm_storage_data_lake_gen2_filesystem.raw \
            azurerm_databricks_access_connector.uc \
            azurerm_role_assignment.uc_storage_blob_data_contributor \
            databricks_storage_credential.raw \
            databricks_external_location.raw \
            databricks_volume.azure_prod_raw \
            databricks_grant.azure_prod_raw_volume_rw \
            databricks_schema.travelops_prod; do
            grep -Fxq "$address" <<<"$azure_state" || {
              echo "Remote Azure PROD state is missing $address; refusing apply."
              exit 1
            }
          done
          actual_storage_account="$(terraform -chdir="$RUNNER_TEMP/lab08-azure-prod" output -raw storage_account_name)"
          [[ $actual_storage_account == "$LAB08_EXPECTED_AZURE_STORAGE_ACCOUNT_NAME" ]] || {
            echo "Azure PROD remote state points to unexpected storage account: $actual_storage_account"
            exit 1
          }
          terraform -chdir="$RUNNER_TEMP/lab08-azure-prod" plan -no-color \
            -out="$RUNNER_TEMP/azure-prod-fresh.tfplan" | tee "$RUNNER_TEMP/azure-prod-fresh-plan.txt"
          terraform -chdir="$RUNNER_TEMP/lab08-azure-prod" show -json \
            "$RUNNER_TEMP/azure-prod-fresh.tfplan" > "$RUNNER_TEMP/azure-prod-fresh-plan.json"
          rbac_actions="$(jq -r '
            first(.resource_changes[]? |
              select(.address == "azurerm_role_assignment.uc_storage_blob_data_contributor") |
              .change.actions | join(",")) // "missing"
          ' "$RUNNER_TEMP/azure-prod-fresh-plan.json")"
          if [[ $rbac_actions != "no-op" ]]; then
            echo "The existing Access Connector RBAC assignment would change, but the GitHub managed identity does not have RBAC administration permission. Refusing apply."
            echo "Planned RBAC actions: $rbac_actions"
            exit 1
          fi
          change_count="$(jq '[.resource_changes[]? | select(.change.actions != ["no-op"])] | length' "$RUNNER_TEMP/azure-prod-fresh-plan.json")"
          [[ $change_count -eq 0 ]] || {
            echo "Azure PROD state must be fully migrated and unchanged before apply; found $change_count change(s)."
            exit 1
          }
          terraform -chdir="$RUNNER_TEMP/lab08-azure-prod" apply -auto-approve "$RUNNER_TEMP/azure-prod-fresh.tfplan"
          set +e
          terraform -chdir="$RUNNER_TEMP/lab08-azure-prod" plan -no-color -detailed-exitcode | tee "$RUNNER_TEMP/azure-prod-idempotency.txt"
          idempotency_code=${PIPESTATUS[0]}
          set -e
          if [[ $idempotency_code -ne 0 ]]; then
            echo "Azure PROD Terraform is not idempotent; exit code was $idempotency_code."
            exit 1
          fi
      - name: Export Terraform output
        id: tf-output
        shell: bash
        run: |
          value="$(terraform -chdir="$RUNNER_TEMP/lab08-azure-prod" output -raw storage_account_name)"
          echo "storage_account_name=$value" >> "$GITHUB_OUTPUT"
      - name: Upload apply evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab08-terraform-apply-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/azure-prod-fresh-plan.txt
            ${{ runner.temp }}/azure-prod-idempotency.txt
          if-no-files-found: warn

  deploy-azure-prod:
    name: Deploy Azure PROD
    if: vars.LAB08_ENABLE_AZURE_OIDC == 'true'
    needs: terraform-apply
    runs-on: ubuntu-latest
    environment: azure-prod
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: labs/lab_08_cicd_travelops
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: databricks/setup-cli@main
      - name: Plan and deploy Azure PROD bundle
        env:
          DATABRICKS_AUTH_TYPE: azure-cli
          DATABRICKS_HOST: ${{ vars.DATABRICKS_AZURE_HOST }}
        shell: bash
        run: |
          storage_account="${{ needs.terraform-apply.outputs.storage_account_name }}"
          # The pinned human-owned root retains an unmanaged human CAN_MANAGE ACL;
          # bundle-managing it would conflict with preserving live IS_OWNER ownership.
          databricks bundle validate -t azure_prod --var azure_storage_account_name="$storage_account"
          databricks bundle plan -t azure_prod --var azure_storage_account_name="$storage_account" | tee azure-prod-bundle-plan.txt
          grep -Eq "Plan: [0-9]+ to add, [0-9]+ to change, 0 to delete" azure-prod-bundle-plan.txt
          databricks bundle deploy -t azure_prod --var azure_storage_account_name="$storage_account"

  validate-azure-prod:
    name: Validate Azure PROD
    if: vars.LAB08_ENABLE_AZURE_OIDC == 'true'
    needs: [terraform-apply, deploy-azure-prod]
    runs-on: ubuntu-latest
    environment: azure-prod
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: labs/lab_08_cicd_travelops
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: databricks/setup-cli@main
      - name: Verify external storage objects and unchanged bundle
        env:
          DATABRICKS_AUTH_TYPE: azure-cli
          DATABRICKS_HOST: ${{ vars.DATABRICKS_AZURE_HOST }}
        shell: bash
        run: |
          storage_account="${{ needs.terraform-apply.outputs.storage_account_name }}"
          databricks external-locations get lab08_travelops_raw_external_location \
            -t azure_prod \
            --output json
          databricks volumes read dbr_dev.parvinbadalov.lab08_prod_travelops_raw \
            -t azure_prod \
            --output json
          databricks bundle plan -t azure_prod --var azure_storage_account_name="$storage_account" | tee azure-prod-final-plan.txt
          grep -Fq "Plan: 0 to add, 0 to change, 0 to delete" azure-prod-final-plan.txt

  approve-azure-release-pat:
    name: Approve Azure Release (Temporary PAT)
    if: >-
      needs.validate-personal-prod.result == 'success' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.LAB08_ENABLE_AZURE_OIDC == 'false'
    needs: validate-personal-prod
    runs-on: ubuntu-latest
    environment: azure-release-approval
    steps:
      - name: Approved
        run: echo "Azure PROD deployment (temporary PAT path) approved."

  deploy-run-azure-prod-pat:
    name: Deploy and Run Azure PROD (Temporary PAT)
    if: >-
      needs.approve-azure-release-pat.result == 'success' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.LAB08_ENABLE_AZURE_OIDC == 'false'
    needs: approve-azure-release-pat
    runs-on: ubuntu-latest
    environment: azure-prod
    permissions:
      contents: read
    defaults:
      run:
        working-directory: labs/lab_08_cicd_travelops
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - name: Validate, deploy, run, and verify Azure PROD with PAT
        env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_AZURE_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_AZURE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          storage_account="${{ vars.LAB08_AZURE_STORAGE_ACCOUNT_NAME || 'lab08travelops63e621' }}"
          [[ -n "$DATABRICKS_HOST" ]] || { echo "DATABRICKS_AZURE_HOST is required."; exit 1; }
          [[ -n "$DATABRICKS_TOKEN" ]] || { echo "DATABRICKS_AZURE_TOKEN is required."; exit 1; }
          [[ -n "$storage_account" ]] || { echo "LAB08_AZURE_STORAGE_ACCOUNT_NAME is required."; exit 1; }
          # The pinned human-owned root retains an unmanaged human CAN_MANAGE ACL;
          # bundle-managing it would conflict with preserving live IS_OWNER ownership.
          databricks bundle validate -t azure_prod --var azure_storage_account_name="$storage_account"
          databricks bundle plan -t azure_prod --var azure_storage_account_name="$storage_account" | tee azure-prod-pat-plan.txt
          grep -Eq "Plan: [0-9]+ to add, [0-9]+ to change, 0 to delete" azure-prod-pat-plan.txt
          databricks bundle deploy -t azure_prod --var azure_storage_account_name="$storage_account"
          databricks bundle run -t azure_prod travelops_promotion_job --var azure_storage_account_name="$storage_account"
          databricks bundle validate -t azure_prod --var azure_storage_account_name="$storage_account"
          databricks bundle plan -t azure_prod --var azure_storage_account_name="$storage_account" | tee azure-prod-pat-final-plan.txt
          grep -Fq "Plan: 0 to add, 0 to change, 0 to delete" azure-prod-pat-final-plan.txt

  run-azure-prod:
    name: Run Azure PROD (OIDC, Explicitly Gated)
    if: >-
      github.ref == 'refs/heads/main' &&
      vars.LAB08_ENABLE_AZURE_OIDC == 'true' &&
      needs.terraform-apply.result == 'success' &&
      needs.validate-azure-prod.result == 'success' &&
      (
        (github.event_name == 'push' && vars.LAB08_RUN_AZURE_PROD_JOB == 'true') ||
        (github.event_name == 'workflow_dispatch' && inputs.run_azure_prod_job == true)
      )
    needs: [terraform-apply, validate-azure-prod]
    runs-on: ubuntu-latest
    environment: azure-prod
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: labs/lab_08_cicd_travelops
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: databricks/setup-cli@main
      - name: Run Azure PROD application job after explicit authorization
        env:
          DATABRICKS_AUTH_TYPE: azure-cli
          DATABRICKS_HOST: ${{ vars.DATABRICKS_AZURE_HOST }}
        run: >-
          databricks bundle run travelops_promotion_job -t azure_prod
          --var azure_storage_account_name=${{ needs.terraform-apply.outputs.storage_account_name }}
