
name: Lab 10 - Terraform CI

on:
  push:
    branches: [main]
    paths:
      - "labs/lab_10_federation_cdc/**"
      - ".github/workflows/lab10_terraform_ci.yml"
      - ".github/workflows/lab10_azure_prod_cd.yml"
      - ".github/workflows/lab10_azure_prod_run.yml"

  pull_request:
    paths:
      - "labs/lab_10_federation_cdc/**"
      - ".github/workflows/lab10_terraform_ci.yml"
      - ".github/workflows/lab10_azure_prod_cd.yml"
      - ".github/workflows/lab10_azure_prod_run.yml"

permissions:
  contents: read

jobs:
  terraform-validation:
    name: Validate Lab 10 Terraform (${{ matrix.root }})
    runs-on: ubuntu-24.04

    # Personal DEV and Azure PROD are separate roots with separate HCP state;
    # both get the same static checks. Neither job contacts a workspace.
    strategy:
      fail-fast: false
      matrix:
        root:
          - terraform
          - terraform_azure_prod

    defaults:
      run:
        working-directory: labs/lab_10_federation_cdc/${{ matrix.root }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Validate Lab 10 notebooks and deployment safety
        run: python3 ../scripts/validate_lab10_static.py

      - name: Test that the validator rejects unsafe changes
        run: python3 -m unittest discover -s ../tests -v

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "1.15.8"

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Init
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: Terraform Validate
        run: terraform validate -no-color
