name: Lab 12 - RAG CI

on:
  pull_request:
    paths:
      - "labs/lab_12_ai_capstone_rag/**"
      - ".github/workflows/lab12_ci.yml"
  push:
    branches: [main]
    paths:
      - "labs/lab_12_ai_capstone_rag/**"
      - ".github/workflows/lab12_ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lab12-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-validation:
    name: Offline lint, tests, build, and bundle checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: labs/lab_12_ai_capstone_rag
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: labs/lab_12_ai_capstone_rag/pyproject.toml
      - name: Install offline development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Pytest
        run: pytest
      - name: Validate bundle configuration without authentication
        run: python scripts/validate_bundle_static.py
      - name: Build wheel
        run: python -m build --wheel

