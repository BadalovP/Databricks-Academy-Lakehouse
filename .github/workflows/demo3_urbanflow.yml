name: Demo 3 · UrbanFlow static validation

on:
  pull_request:
    paths:
      - "Demos/Demo3/**"
      - ".github/workflows/demo3_urbanflow.yml"
      - ".github/workflows/demo3_urbanflow_deploy.yml"
  push:
    branches: [main]
    paths:
      - "Demos/Demo3/**"
      - ".github/workflows/demo3_urbanflow.yml"
      - ".github/workflows/demo3_urbanflow_deploy.yml"
  workflow_dispatch:
    inputs:
      run_live_control_plane:
        description: Run approval-gated read-only Azure Databricks validation
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: demo3-urbanflow-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-validation:
    name: Ruff, Black, pytest, and bundle validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Demos/Demo3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Demos/Demo3/pyproject.toml
      - name: Install package and test tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Black
        run: black --check .
      - name: Pytest (offline and mocked only)
        run: pytest
      - name: Install Databricks CLI
        uses: databricks/setup-cli@main
      - name: Validate bundle structure without workspace authentication
        run: python scripts/validate_bundle.py

  approve-live-control-plane:
    name: Approve UrbanFlow Live Control-Plane Validation
    if: github.event_name == 'workflow_dispatch' && inputs.run_live_control_plane == true
    needs: static-validation
    runs-on: ubuntu-latest
    environment: azure-release-approval
    steps:
      - name: Record approval
        run: echo "Read-only UrbanFlow Azure control-plane validation approved."

  live-control-plane-validation:
    name: Validate UrbanFlow Azure Control Plane
    if: github.event_name == 'workflow_dispatch' && inputs.run_live_control_plane == true
    needs: approve-live-control-plane
    runs-on: ubuntu-latest
    environment: azure-prod
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: Demos/Demo3
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: databricks/setup-cli@main
      - name: Verify pinned workspace and authentication
        env:
          DATABRICKS_AUTH_TYPE: azure-cli
          DATABRICKS_HOST: ${{ vars.DATABRICKS_AZURE_HOST }}
        shell: bash
        run: |
          set -euo pipefail
          expected_host="https://adb-7405604503619901.1.azuredatabricks.net"
          [[ -n "${DATABRICKS_HOST:-}" ]] || { echo "::error::DATABRICKS_AZURE_HOST is required."; exit 1; }
          [[ "${DATABRICKS_HOST%/}" == "$expected_host" ]] || {
            echo "::error::Resolved host does not match the pinned UrbanFlow Azure workspace."
            exit 1
          }
          databricks current-user me --output json > "$RUNNER_TEMP/urbanflow-current-user.json"
          python -c "import json, pathlib; p=pathlib.Path('$RUNNER_TEMP/urbanflow-current-user.json'); u=json.loads(p.read_text())['userName']; print(f'Authenticated Databricks identity: {u}')"
      - name: Validate bundle and discover owned resources
        env:
          DATABRICKS_AUTH_TYPE: azure-cli
          DATABRICKS_HOST: ${{ vars.DATABRICKS_AZURE_HOST }}
        shell: bash
        run: |
          set -euo pipefail
          databricks bundle validate -t azure

          # The unified Job is the only UrbanFlow Job; the four component Jobs were retired on
          # 2026-10-03 (evidence/2026-10-03_retired_component_jobs.json).
          databricks jobs get 991496516229387 --output json > "$RUNNER_TEMP/urbanflow-job.json"
          python -c "import json,sys; d=json.load(open(sys.argv[1]))['settings']; assert d['name']=='[azure] UrbanFlow End-to-End'; assert {t['existing_cluster_id'] for t in d['tasks']}=={'0702-132442-toro5spu'}; assert len(d['tasks'])==7 and 'schedule' not in d and 'trigger' not in d; print('Verified Job 991496516229387: [azure] UrbanFlow End-to-End, 7 GP1 tasks, unscheduled')" "$RUNNER_TEMP/urbanflow-job.json"

          # The Lakeflow comparison pipeline must stay isolated, triggered and unscheduled.
          databricks pipelines get fb8a0b8a-cdf8-45c4-bff6-2d117a516fb9 --output json \
            > "$RUNNER_TEMP/urbanflow-pipeline.json"
          python -c "import json,sys; s=json.load(open(sys.argv[1]))['spec']; assert s['schema']=='parvinbadalov_urbanflow_lakeflow', s['schema']; assert not s.get('continuous') and not s.get('trigger'); print('Verified pipeline: isolated schema parvinbadalov_urbanflow_lakeflow, triggered, unscheduled')" "$RUNNER_TEMP/urbanflow-pipeline.json"

      # A fresh runner has no local DAB deployment state, so idempotency is proved by the separate
      # authenticated before/deploy/after plan sequence rather than a misleading CI plan.
      # This live path performs only authentication, bundle validation, and resource reads.
      # It has no deploy, run, cluster lifecycle, pipeline update, or data-plane command.
