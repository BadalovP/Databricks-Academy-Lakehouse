# LAB 09 - Databricks CI/CD
#
# Pull requests and pushes run one mocked, static validation job. Live work is
# reachable only through workflow_dispatch, where deployment_target selects
# exactly one approval-gated environment path.
name: LAB 09 · Databricks CI/CD

on:
  pull_request:
    paths:
      - "labs/lab_09_rest_api_automation/**"
      - ".github/workflows/lab09.yml"
  push:
    branches: [main]
    paths:
      - "labs/lab_09_rest_api_automation/**"
      - ".github/workflows/lab09.yml"
  workflow_dispatch:
    inputs:
      deployment_target:
        description: Databricks deployment target
        required: true
        default: personal
        type: choice
        options:
          - personal
          - azure

permissions:
  contents: read

concurrency:
  group: lab09-cicd-${{ github.event_name }}-${{ github.ref }}-${{ inputs.deployment_target || 'static' }}
  cancel-in-progress: false

env:
  LAB09_ROOT: labs/lab_09_rest_api_automation
  # Literal and reviewable. The Azure connection must match this host before
  # either deployment or execution can touch a Databricks resource.
  AZURE_PROD_EXPECTED_HOST: "adb-7405604503619901.1.azuredatabricks.net"

jobs:
  static-checks:
    name: Static Checks and Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: labs/lab_09_rest_api_automation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . -r requirements-dev.txt
      - name: Ruff
        run: ruff check .
      - name: Black
        run: black --check .
      - name: Pytest (mocked WorkspaceClient only -- no live Databricks resources)
        run: pytest

  run-personal-automation:
    name: Run Lab 9 Personal Automation
    if: github.event_name == 'workflow_dispatch' && inputs.deployment_target == 'personal'
    needs: static-checks
    runs-on: ubuntu-latest
    environment: personal-prod-approval
    defaults:
      run:
        working-directory: labs/lab_09_rest_api_automation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . -r requirements-dev.txt
      - name: Verify required Databricks workspace configuration is set
        env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_PERSONAL_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_PERSONAL_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${DATABRICKS_HOST:-}" ]; then
            echo "::error::DATABRICKS_PERSONAL_HOST is not set for the personal target. Refusing to guess a Databricks workspace."
            exit 1
          fi
          if [ -z "${DATABRICKS_TOKEN:-}" ]; then
            echo "::error::DATABRICKS_PERSONAL_TOKEN is not set for the personal target."
            exit 1
          fi
          echo "Required Databricks workspace configuration is present."
      - name: Run Lab 9 automation end to end
        env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_PERSONAL_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_PERSONAL_TOKEN }}
        run: python -m lab09.cli run-all
      - name: Upload Lab 9 Personal run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab09-personal-report-${{ github.run_id }}
          path: labs/lab_09_rest_api_automation/evidence/lab09_report.json
          if-no-files-found: warn

  approve-azure-deployment:
    name: Approve Azure Deployment and Execution
    if: github.event_name == 'workflow_dispatch' && inputs.deployment_target == 'azure'
    needs: static-checks
    runs-on: ubuntu-latest
    environment: azure-release-approval
    steps:
      - name: Approved
        run: echo "Azure LAB 09 deployment and execution approved."

  deploy-azure-job:
    name: Deploy LAB 09 to Azure (idempotent)
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.deployment_target == 'azure' &&
      needs.approve-azure-deployment.result == 'success'
    needs: approve-azure-deployment
    runs-on: ubuntu-latest
    environment: azure-prod
    permissions:
      contents: read
      id-token: write
    outputs:
      job_id: ${{ steps.deploy.outputs.job_id }}
    defaults:
      run:
        working-directory: labs/lab_09_rest_api_automation
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . -r requirements-dev.txt
      - name: Verify Azure workspace and identity (read-only)
        env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_AZURE_HOST }}
          DATABRICKS_AUTH_TYPE: azure-cli
        run: |
          set -euo pipefail
          if [ -z "${DATABRICKS_HOST:-}" ]; then
            echo "::error::DATABRICKS_AZURE_HOST is not set. Refusing to guess a workspace."
            exit 1
          fi
          python -c "
          from lab09.client import get_workspace_client, normalize_host
          client = get_workspace_client()
          print('Host:', client.config.host)
          print('Identity:', client.current_user.me().user_name)
          expected = normalize_host('${AZURE_PROD_EXPECTED_HOST}')
          actual = normalize_host(client.config.host)
          if actual != expected:
              raise SystemExit(
                  f'DATABRICKS_AZURE_HOST resolved to {actual!r}, which does not match '
                  f'the pinned AZURE_PROD_EXPECTED_HOST {expected!r}. Refusing to proceed.'
              )
          print('Host matches the pinned AZURE_PROD_EXPECTED_HOST.')
          "
      - name: Deploy the three-task Job idempotently (never triggers a run)
        id: deploy
        env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_AZURE_HOST }}
          DATABRICKS_AUTH_TYPE: azure-cli
        run: |
          set -euo pipefail
          python scripts/deploy_azure_job.py --confirm-host "${AZURE_PROD_EXPECTED_HOST}" \
            | tee azure-deploy-report.json
          job_id="$(python -c "import json; print(json.load(open('azure-deploy-report.json'))['job_id'])")"
          echo "job_id=$job_id" >> "$GITHUB_OUTPUT"
      - name: Upload deployment report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab09-azure-deploy-report-${{ github.run_id }}
          path: labs/lab_09_rest_api_automation/azure-deploy-report.json
          if-no-files-found: warn

  run-azure-job:
    name: Trigger and Monitor the Azure Job
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.deployment_target == 'azure' &&
      needs.deploy-azure-job.result == 'success'
    needs: deploy-azure-job
    runs-on: ubuntu-latest
    environment: azure-prod
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: labs/lab_09_rest_api_automation
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . -r requirements-dev.txt
      - name: Trigger the run, monitor to completion, collect output, verify cleanup
        env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_AZURE_HOST }}
          DATABRICKS_AUTH_TYPE: azure-cli
        run: python scripts/run_azure_job.py --confirm-host "${AZURE_PROD_EXPECTED_HOST}"
      - name: Upload execution report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab09-azure-run-report-${{ github.run_id }}
          path: labs/lab_09_rest_api_automation/evidence/azure_run_report.json
          if-no-files-found: warn
