
# LAB 10 - Lakehouse Federation & CDC
#
# Manual Terraform deployment using HCP Terraform remote state.
# HCP organization: badalov-lakehouse-labs
# HCP workspace: lab10-personal-dev
#
# Authentication:
# - HCP_TERRAFORM_TOKEN: GitHub environment secret
# - DATABRICKS_PERSONAL_TOKEN: GitHub repository secret
#
# Manages existing Databricks Job 453391098761164.
# Does not migrate state, create a new Job, or trigger notebook execution.

name: Lab 10 - Terraform CD

on:
  workflow_dispatch:
    inputs:
      # The confirmation alone decides the operation, so there is no second
      # input that can disagree with it:
      #   empty                    -> plan only
      #   APPLY-453391098761164    -> plan, then apply that saved plan
      #   anything else            -> fail
      confirmation:
        description: "Leave EMPTY for plan only. Type APPLY-453391098761164 to apply."
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: lab10-personal-dev-terraform
  cancel-in-progress: false

jobs:
  terraform-deploy:
    name: Lab 10 Terraform Plan or Apply
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    environment:
      name: lab10-personal-dev

    defaults:
      run:
        working-directory: labs/lab_10_federation_cdc/terraform

    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "0"
      TF_TOKEN_app_terraform_io: ${{ secrets.HCP_TERRAFORM_TOKEN }}

      DATABRICKS_HOST: https://dbc-1750318a-76a9.cloud.databricks.com
      DATABRICKS_AUTH_TYPE: pat
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_PERSONAL_TOKEN }}

    steps:
      # Step 1 - Checkout must happen before commands
      # that use the repository working directory.
      - name: Checkout repository
        uses: actions/checkout@v5

      # Step 2 - Resolve the operation ONCE from the confirmation.
      # Later steps use steps.request.outputs.action, never the raw input.
      - name: Check deployment request
        id: request
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          # Exact matching only. Whitespace is never trimmed: a stray space is
          # rejected rather than guessed at, so an apply always needs the exact
          # phrase and a plan needs a truly empty field.
          if [[ -z "$CONFIRMATION" ]]; then
            ACTION="plan"
          elif [[ "$CONFIRMATION" == "APPLY-453391098761164" ]]; then
            ACTION="apply"
          elif [[ -z "${CONFIRMATION//[[:space:]]/}" ]]; then
            echo "::error::Confirmation contains only whitespace. Leave it completely empty for a plan, or type APPLY-453391098761164 to apply."
            exit 1
          else
            echo "::error::Unrecognised confirmation. Leave it empty for a plan, or type exactly APPLY-453391098761164 (no spaces) to apply."
            exit 1
          fi

          echo "Resolved operation: $ACTION"
          echo "action=$ACTION" >> "$GITHUB_OUTPUT"
          if [[ "$ACTION" == "apply" ]]; then
            echo "### Lab 10 CD - operation: \`APPLY\` (plan, then apply the saved plan)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Lab 10 CD - operation: \`PLAN ONLY\`" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [[ -z "$TF_TOKEN_app_terraform_io" ]]; then
            echo "::error::Missing HCP Terraform token."
            exit 1
          fi

          if [[ -z "$DATABRICKS_TOKEN" ]]; then
            echo "::error::Missing Databricks token."
            exit 1
          fi

      # Step 3 - Install the pinned Terraform CLI.
      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      # Step 4 - Check Terraform formatting.
      - name: Terraform Format Check
        run: terraform fmt -check

      # Step 5 - Initialize HCP Terraform backend.
      - name: Terraform Init
        run: terraform init -input=false -lockfile=readonly

      # Step 6 - Verify remote state manages the existing Job.
      - name: Verify existing Job state
        run: |
          terraform state list | grep -Fxq "databricks_job.lab10"

          JOB_ID="$(terraform output -raw job_id)"

          if [[ "$JOB_ID" != "453391098761164" ]]; then
            echo "::error::Unexpected Databricks Job ID."
            exit 1
          fi

      # Step 7 - Generate the Terraform execution plan.
      - name: Terraform Plan
        run: |
          terraform plan \
            -input=false \
            -lock-timeout=5m \
            -out=lab10.tfplan \
            -no-color

      # Step 8 - Allow only no-op or in-place updates.
      # Block resource creation, deletion, and replacement.
      - name: Block unsafe resource changes
        run: |
          terraform show -json lab10.tfplan |
            jq -e '
              all(.resource_changes[]?;
                .address == "databricks_job.lab10" and
                (
                  .change.actions == ["no-op"] or
                  .change.actions == ["update"]
                )
              )
            '

      # Step 9 - Apply only when explicitly requested.
      - name: Terraform Apply
        id: apply
        if: steps.request.outputs.action == 'apply'
        run: terraform apply -input=false -no-color lab10.tfplan

      # Step 10 - Confirm the existing Job is preserved.
      - name: Verify Job ID after deployment
        id: verify
        if: steps.request.outputs.action == 'apply'
        run: |
          JOB_ID="$(terraform output -raw job_id)"

          if [[ "$JOB_ID" != "453391098761164" ]]; then
            echo "::error::Unexpected Job ID after deployment."
            exit 1
          fi
          echo "Verified existing Job $JOB_ID after apply." >> "$GITHUB_STEP_SUMMARY"

      # Step 11 - An explicitly requested apply must never end as a skipped step
      # inside a green run.
      - name: Require apply to have executed
        if: always() && steps.request.outputs.action == 'apply'
        env:
          APPLY_OUTCOME: ${{ steps.apply.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          echo "Apply outcome: $APPLY_OUTCOME; Job ID verification outcome: $VERIFY_OUTCOME"
          if [[ "$APPLY_OUTCOME" != "success" || "$VERIFY_OUTCOME" != "success" ]]; then
            echo "::error::Apply was requested but did not complete successfully."
            exit 1
          fi

      # Step 12 - Make a plan-only run unmistakable in the summary.
      - name: Report plan-only run
        if: steps.request.outputs.action == 'plan'
        run: echo "Plan only - Terraform Apply was intentionally not run." >> "$GITHUB_STEP_SUMMARY"
